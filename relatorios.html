<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios — Meu Espaço Psicopedagógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div class="card no-print">
      <h2>Gerar relatório</h2>
      <label>Aluno</label>
      <select id="relAluno"><option value="">Carregando...</option></select>

      <label>Tipo de relatório</label>
      <select id="relTipo">
        <option value="inicial">Relatório inicial</option>
        <option value="acompanhamento">Acompanhamento</option>
        <option value="evolucao">Evolução</option>
        <option value="encerramento">Encerramento</option>
        <option value="responsaveis">Para responsáveis</option>
      </select>

      <button class="primary" id="btnGerar">Gerar relatório</button>
      <button class="secundario" id="btnImprimir" style="margin-top:8px; width:100%;">Imprimir / Salvar como PDF</button>
      <div id="msgRel" class="msg"></div>
    </div>

    <div class="card" id="relatorioBox" style="display:none;">
      <div contenteditable="true" id="relatorioConteudo" style="outline:none; min-height:200px; line-height:1.6;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/relatorios.js"></script>
</body>
</html>
