<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolução — Meu Espaço Psicopedagógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>

  <div class="container">
    <div class="card">
      <h2>Registrar evolução da sessão</h2>

      <label>Aluno</label>
      <select id="evAluno"><option value="">Carregando...</option></select>

      <label>Data</label>
      <input id="evData" type="date" />

      <label>Objetivo da sessão</label>
      <textarea id="evObjetivo" rows="2"></textarea>

      <label>Atividades realizadas</label>
      <textarea id="evAtividades" rows="2"></textarea>

      <label>Habilidades trabalhadas</label>
      <textarea id="evHabilidades" rows="2"></textarea>

      <label>Desempenho observado / participação</label>
      <textarea id="evDesempenho" rows="2"></textarea>

      <label>Dificuldades apresentadas</label>
      <textarea id="evDificuldades" rows="2"></textarea>

      <label>Avanços observados</label>
      <textarea id="evAvancos" rows="2"></textarea>

      <label>Pontos a retomar / próximos passos</label>
      <textarea id="evProximos" rows="2"></textarea>

      <label>Observações profissionais</label>
      <textarea id="evObservacoes" rows="2"></textarea>

      <button class="primary" id="btnSalvarEv">Salvar evolução</button>
      <div id="msgEv" class="msg"></div>
    </div>

    <div class="card">
      <h2>Histórico do aluno</h2>
      <div id="historicoEv" style="color:#6B6B6B;">Selecione um aluno para ver o histórico.</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
<script src="js/menu.js"></script>
  <script src="js/evolucao.js"></script>
</body>
</html>
