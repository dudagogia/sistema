<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Ficha — Meu Espaço Psicopedagógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .ficha-box {
      background: #fff;
      border: 1px solid #D9D3C5;
      border-radius: 8px;
      padding: 28px;
      margin-top: 16px;
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.6;
      color: #2B2B2B;
    }
    .ficha-box h1 { font-size: 1.25rem; color: #1F4E5F; margin-bottom: 4px; }
    .ficha-box h2 { font-size: 1rem; color: #1F4E5F; margin-top: 18px; border-bottom: 1px solid #EAE5D9; padding-bottom: 4px; }
    .ficha-box .meta { font-size: 0.9rem; color: #6B6B6B; }
    .ficha-box .linha { margin: 6px 0; }
    .ficha-box .anotacoes {
      border: 1px dashed #C9C3E6;
      min-height: 120px;
      padding: 8px;
      margin-top: 8px;
      border-radius: 6px;
    }
    .ficha-box .assinatura { margin-top: 32px; font-size: 0.9rem; color: #6B6B6B; }

    @media print {
      header, .no-print, .card.no-print { display: none !important; }
      .container { padding: 0; max-width: 100%; }
      .ficha-box {
        border: none;
        border-radius: 0;
        padding: 0;
        page-break-inside: avoid;
      }
      body { background: #fff; }
    }
  </style>
</head>
<body>
<div id="app-header"></div>

  <div class="container">
    <!-- Controles -->
    <div class="card no-print">
      <h2>Gerar ficha de atividade</h2>

      <label>Aluno</label>
      <select id="gAluno"><option value="">Carregando...</option></select>

      <label>Atividade da biblioteca</label>
      <select id="gAtividade"><option value="">Carregando...</option></select>

      <label>Data da aplicação</label>
      <input id="gData" type="date" />

      <label>Observações que já queira incluir (opcional)</label>
      <textarea id="gObs" rows="2" placeholder="Ex: Adaptar material para nível mais fácil"></textarea>

      <button class="primary" id="btnGerar">Gerar ficha</button>
      <button class="secundario" id="btnImprimir" style="margin-top:8px; width:100%;">Imprimir / Salvar como PDF</button>
      <div id="msgGerador" class="msg"></div>
    </div>

    <!-- Registro da aplicação -->
    <div class="card no-print" id="registroCard" style="display:none;">
      <h2>Registrar aplicação</h2>
      <p style="font-size:0.85rem; color:#6B6B6B; margin-bottom:10px;">
        Registre como a criança respondeu. Isso alimenta a evolução do aluno.
      </p>

      <label>Desempenho observado</label>
      <textarea id="regDesempenho" rows="2"></textarea>

      <label>Dificuldades apresentadas</label>
      <textarea id="regDificuldades" rows="2"></textarea>

      <label>Avanços observados</label>
      <textarea id="regAvancos" rows="2"></textarea>

      <label>Próximos passos</label>
      <textarea id="regProximos" rows="2"></textarea>

      <button class="primary" id="btnRegistrar">Salvar registro na evolução</button>
      <div id="msgRegistro" class="msg"></div>
    </div>

    <!-- Ficha -->
    <div class="card" id="fichaCard" style="display:none;">
      <div class="ficha-box" id="fichaConteudo"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
<script src="js/menu.js"></script>
  <script src="js/gerador.js"></script>
</body>
</html>
