<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividades — Meu Espaço Psicopedagógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .grid-atividades { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; }
    .ativ-card { background:#FDFBF6; border:1px solid #EAE5D9; border-radius:10px; padding:14px; position:relative; }
    .ativ-card h4 { color:#1F4E5F; margin-bottom:6px; font-size:0.95rem; }
    .ativ-card .tag { display:inline-block; background:#C9C3E6; color:#2B2B2B; font-size:0.72rem; padding:2px 8px; border-radius:10px; margin:2px 2px 0 0; }
    .ativ-card .fav { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:1.2rem; }
    .ativ-card .acoes { margin-top:10px; display:flex; gap:6px; }
    .ativ-card .acoes button { font-size:0.75rem; padding:4px 8px; }
    .filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .filtros input, .filtros select { flex:1; min-width:130px; }
    .detalhe { background:#fff; border-left:4px solid #C9A227; padding:14px; margin-top:10px; font-size:0.9rem; line-height:1.6; }
  </style>
</head>
<body>
<div id="app-header"></div>

  <div class="container">
    <!-- Cadastro -->
    <div class="card">
      <h2>Cadastrar nova atividade</h2>
      <label>Nome da atividade</label>
      <input id="ativNome" type="text" placeholder="Ex: Caça-sílabas iniciais" />

      <label>Área</label>
      <select id="ativArea">
        <option value="consciencia-fonologica">Consciência fonológica</option>
        <option value="alfabetizacao">Alfabetização e leitura</option>
        <option value="escrita">Escrita</option>
        <option value="matematica">Matemática</option>
        <option value="atencao">Atenção e concentração</option>
        <option value="memoria">Memória</option>
        <option value="funcoes-executivas">Funções executivas</option>
        <option value="raciocinio">Raciocínio lógico</option>
        <option value="socioemocional">Desenvolvimento socioemocional</option>
        <option value="motora">Coordenação motora e percepção</option>
      </select>

      <label>Habilidade estimulada</label>
      <input id="ativHabilidade" type="text" placeholder="Ex: Identificação de sons iniciais" />

      <label>Objetivo pedagógico</label>
      <textarea id="ativObjetivo" rows="2"></textarea>

      <label>Faixa etária sugerida</label>
      <input id="ativIdade" type="text" placeholder="Ex: 6 a 8 anos" />

      <label>Nível de dificuldade</label>
      <select id="ativDificuldade">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
      </select>

      <label>Tempo estimado (min)</label>
      <input id="ativTempo" type="number" min="5" step="5" value="20" />

      <label>Materiais necessários</label>
      <input id="ativMateriais" type="text" placeholder="Ex: Lápis, papel, cartões" />

      <label>Instruções passo a passo</label>
      <textarea id="ativInstrucoes" rows="3"></textarea>

      <label>Como aplicar</label>
      <textarea id="ativAplicar" rows="2"></textarea>

      <label>O que observar</label>
      <textarea id="ativObservar" rows="2"></textarea>

      <label>Possíveis adaptações</label>
      <textarea id="ativAdaptacoes" rows="2"></textarea>

      <button class="primary" id="btnSalvarAtiv">Salvar atividade</button>
      <div id="msgAtiv" class="msg"></div>
    </div>

    <!-- Filtros e lista -->
    <div class="card">
      <h2>Biblioteca</h2>
      <div class="filtros">
        <input id="filtroBusca" type="text" placeholder="Buscar por nome ou habilidade" />
        <select id="filtroArea">
          <option value="">Todas as áreas</option>
          <option value="consciencia-fonologica">Consciência fonológica</option>
          <option value="alfabetizacao">Alfabetização e leitura</option>
          <option value="escrita">Escrita</option>
          <option value="matematica">Matemática</option>
          <option value="atencao">Atenção</option>
          <option value="memoria">Memória</option>
          <option value="funcoes-executivas">Funções executivas</option>
          <option value="raciocinio">Raciocínio lógico</option>
          <option value="socioemocional">Socioemocional</option>
          <option value="motora">Coordenação motora</option>
        </select>
        <select id="filtroDificuldade">
          <option value="">Toda dificuldade</option>
          <option value="facil">Fácil</option>
          <option value="medio">Médio</option>
          <option value="dificil">Difícil</option>
        </select>
        <select id="filtroFavoritas">
          <option value="">Todas</option>
          <option value="sim">Somente favoritas</option>
        </select>
      </div>
      <div id="listaAtiv" class="grid-atividades">
        <p style="color:#6B6B6B;">Carregando...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
<script src="js/menu.js"></script>
  <script src="js/atividades.js"></script>
</body>
</html>
